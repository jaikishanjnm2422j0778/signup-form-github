<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account — Signup Form</title>
  <meta name="description" content="A professional, accessible signup form with client-side validation.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <div class="form-card">

      <!-- Header -->
      <header class="form-card__header">
        <span class="mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2C13 2 6 7.5 6 14.5C6 18.6421 9.13401 22 13 22C16.866 22 20 18.6421 20 14.5C20 7.5 13 2 13 2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M13 22V12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        <center>
        <h1>Create your account</h1>
        </center>
        <p class="form-card__subtitle">Tell us a little about yourself to get started. It takes less than a minute.</p>
      </header>

      <!-- Success banner (shown after a valid submit) -->
      <div class="success-banner" id="successMessage" role="status" hidden>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="10" cy="10" r="8.25" stroke="currentColor" stroke-width="1.5"/>
          <path d="M6.5 10.5L9 13L13.5 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Account created successfully! Welcome aboard.</span>
      </div>

      <!-- Form -->
      <form id="signupForm" novalidate>

        <!-- Full Name -->
        <div class="field">
          <label for="fullName">Full name <span class="required" aria-hidden="true">*</span></label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="e.g. Priya Sharma"
            autocomplete="name"
            aria-describedby="fullNameError"
            aria-required="true"
          >
          <p class="error-message" id="fullNameError" aria-live="polite"></p>
        </div>

        <!-- Email -->
        <div class="field">
          <label for="email">Email address <span class="required" aria-hidden="true">*</span></label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="e.g. priya@gmail.com"
            autocomplete="email"
            aria-describedby="emailError"
            aria-required="true"
          >
          <p class="error-message" id="emailError" aria-live="polite"></p>
        </div>

        <!-- Phone -->
        <div class="field">
          <label for="phone">Phone number <span class="required" aria-hidden="true">*</span></label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="10-digit number"
            autocomplete="tel"
            inputmode="numeric"
            aria-describedby="phoneError"
            aria-required="true"
          >
          <p class="error-message" id="phoneError" aria-live="polite"></p>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password">Password <span class="required" aria-hidden="true">*</span></label>
          <div class="input-with-action">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              aria-describedby="passwordError passwordStrengthText"
              aria-required="true"
            >
            <button type="button" class="toggle-visibility" data-target="password" aria-label="Show password">
              <svg class="icon-eye" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M1.5 10C1.5 10 4.5 4 10 4C15.5 4 18.5 10 18.5 10C18.5 10 15.5 16 10 16C4.5 16 1.5 10 1.5 10Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" hidden>
                <path d="M1.5 10C1.5 10 4.5 4 10 4C15.5 4 18.5 10 18.5 10C18.5 10 15.5 16 10 16C4.5 16 1.5 10 1.5 10Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
                <path d="M3 3L17 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="password-strength" id="passwordStrength" aria-hidden="true">
            <div class="password-strength__track">
              <span class="password-strength__fill" id="passwordStrengthFill"></span>
            </div>
            <span class="password-strength__label" id="passwordStrengthText"></span>
          </div>
          <p class="error-message" id="passwordError" aria-live="polite"></p>
        </div>

        <!-- Confirm Password -->
        <div class="field">
          <label for="confirmPassword">Confirm password <span class="required" aria-hidden="true">*</span></label>
          <div class="input-with-action">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              aria-describedby="confirmPasswordError"
              aria-required="true"
            >
            <button type="button" class="toggle-visibility" data-target="confirmPassword" aria-label="Show password">
              <svg class="icon-eye" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M1.5 10C1.5 10 4.5 4 10 4C15.5 4 18.5 10 18.5 10C18.5 10 15.5 16 10 16C4.5 16 1.5 10 1.5 10Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" hidden>
                <path d="M1.5 10C1.5 10 4.5 4 10 4C15.5 4 18.5 10 18.5 10C18.5 10 15.5 16 10 16C4.5 16 1.5 10 1.5 10Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
                <path d="M3 3L17 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <p class="error-message" id="confirmPasswordError" aria-live="polite"></p>
        </div>

        <!-- Message -->
        <div class="field">
          <label for="message">Message <span class="required" aria-hidden="true">*</span></label>
          <textarea
            id="message"
            name="message"
            rows="4"
            placeholder="Tell us what you're looking for..."
            aria-describedby="messageError"
            aria-required="true"
          ></textarea>
          <p class="error-message" id="messageError" aria-live="polite"></p>
        </div>

        <!-- Terms -->
        <div class="field field--checkbox">
          <input type="checkbox" id="terms" name="terms" aria-describedby="termsError" aria-required="true">
          <label for="terms">I agree to the <a href="#" onclick="return false;">Terms &amp; Conditions</a></label>
          <p class="error-message" id="termsError" aria-live="polite"></p>
        </div>

        <!-- Submit -->
        <button type="submit" class="submit-button">Create Account</button>

      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
